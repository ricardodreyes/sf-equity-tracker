<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map: shelters, housing and behavioral health sites</title>
  <meta name="description" content="Where San Francisco puts its shelters, supportive housing, and behavioral health facilities, by supervisor district and neighborhood." />
  <meta property="og:title" content="SF Geographic Equity Tracker" />
  <meta property="og:description" content="Every shelter, PSH building, and behavioral health facility in SF, mapped against the 2025 geographic equity ordinance." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="map"></div>
  <aside class="panel" id="panel">
    <div class="seg" role="group" aria-label="Display mode">
      <button id="mode-dots" aria-pressed="true">Facilities</button>
      <button id="mode-choropleth" aria-pressed="false">District shading</button>
    </div>
    <div id="dots-controls"></div>
    <div id="choropleth-controls" hidden>
      <label for="metric">Shade districts by</label>
      <select id="metric">
        <option value="shelter_beds_share">Share of shelter beds (%)</option>
        <option value="shelter_beds_per_10k">Shelter beds per 10k residents</option>
      </select>
      <div class="legend-ramp"></div>
      <div style="display:flex;justify-content:space-between" class="note"><span id="ramp-min">0</span><span id="ramp-max"></span></div>
    </div>
    <div class="note" id="asof" style="margin-top:.5rem"></div>
  </aside>
  <script type="module" src="/src/map.js"></script>
</body>
</html>
